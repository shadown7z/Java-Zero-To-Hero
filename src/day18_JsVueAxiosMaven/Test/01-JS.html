<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS-???</title>
</head>
<body>
      <h1>这是一个标题</h1>
  <script>
    //alert('Hello World');
    let name = 'Tom';
    let age = 20;
    console.log('我是'+name+',我今年'+age+'岁');
    console.log(`我是${name},我今年${age}岁`)

    //普通函数
    function add(a,b){
      return a+b;
    }
    console.log(add(10,20));
    //箭头函数
    const add2 = (a,b) => a+b;
    console.log(add2(30,40));

    //对象
    let user = {
      name:"Tom",
      age:18,
      sayHello:function(){
        console.log(`Hello,我是${this.name},我今年${this.age}岁`);
      }
    }
    user.sayHello();

    //数组
    let arr = [1,2,3,4,5];
    //取值
    console.log(arr[0]); // 1
    //遍历
    for(let i=0;i<arr.length;i++){
      console.log(arr[i]);
    }
    //其他遍历方法,直接打印数组
    console.log(arr)
    //常用方法
    arr.push(6); //添加元素
    arr.pop(); //删除最后一个元素

    // JSON
    let jsonStr = '{"name":"Tom","age":18}';
    let jsonObj = JSON.parse(jsonStr); //字符串转对象
    console.log(jsonObj.name); // Tom
    console.log(jsonObj.age); // 18

    // DOM操作
    let h1 = document.querySelector('h1');
    h1.innerHTML = '这是修改后的标题';
  </script>
</body>
</html>
