<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Vue DevTools 练习页面</title>

    <!-- Vue 3 CDN（DevTools 可识别） -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        table {
            border-collapse: collapse;
            width: 600px;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }

        th {
            background: #f5f5f5;
        }

        input {
            margin: 5px;
            padding: 5px;
        }
    </style>
</head>

<body>

<div id="app">

    <h2>Vue DevTools 练习：员工管理系统</h2>

    <!-- 🔥 输入区域（v-model双向绑定） -->
    <div>
        <input v-model="name" placeholder="姓名">
        <input v-model.number="age" placeholder="年龄">
        <input v-model="job" placeholder="职位">

        <button @click="addEmployee">添加员工</button>
    </div>

    <hr>

    <!-- 🔥 统计信息（computed） -->
    <p>员工总数：{{ total }}</p>

    <!-- 🔥 v-for 员工列表 -->
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>姓名</th>
                <th>年龄</th>
                <th>职位</th>
                <th>操作</th>
            </tr>
        </thead>

        <tbody>
            <tr v-for="emp in employees" :key="emp.id">
                <td>{{ emp.id }}</td>
                <td>{{ emp.name }}</td>
                <td>{{ emp.age }}</td>
                <td>{{ emp.job }}</td>
                <td>
                    <button @click="deleteEmployee(emp.id)">删除</button>
                </td>
            </tr>
        </tbody>
    </table>

</div>

<script>
const { createApp } = Vue;

createApp({
    // 🔥 响应式数据（DevTools里能看到）
    data() {
        return {
            name: "",
            age: "",
            job: "",

            // 员工数据
            employees: [
                { id: 1, name: "张三", age: 20, job: "Java开发" },
                { id: 2, name: "李四", age: 22, job: "前端开发" },
                { id: 3, name: "王五", age: 25, job: "测试工程师" }
            ]
        }
    },

    // 🔥 计算属性（DevTools重点观察）
    computed: {
        total() {
            return this.employees.length;
        }
    },

    methods: {

        // ➕ 添加员工
        addEmployee() {
            if (!this.name || !this.age || !this.job) {
                alert("请填写完整信息");
                return;
            }

            this.employees.push({
                id: Date.now(),
                name: this.name,
                age: this.age,
                job: this.job
            });

            // 清空输入
            this.name = "";
            this.age = "";
            this.job = "";
        },

        // ❌ 删除员工
        deleteEmployee(id) {
            this.employees = this.employees.filter(emp => emp.id !== id);
        }
    }
}).mount("#app");
</script>

</body>
</html>
